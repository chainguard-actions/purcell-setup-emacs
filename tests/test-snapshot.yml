name: Test snapshot Emacs installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-emacs
        name: Set up Emacs snapshot
        uses: .
        with:
          version: "snapshot"

      - name: Assert Emacs snapshot is installed
        run: |
          echo "Checking emacs is on PATH..."
          if ! command -v emacs &>/dev/null; then
            echo "FAIL: emacs not found on PATH"
            exit 1
          fi
          echo "PASS: emacs found at $(command -v emacs)"
          echo "Checking emacs can run..."
          EMACS_VERSION="$(emacs --version | head -1)"
          echo "emacs version: $EMACS_VERSION"
          if echo "$EMACS_VERSION" | grep -qi "emacs"; then
            echo "PASS: emacs snapshot installed and runnable"
          else
            echo "FAIL: unexpected emacs version output: $EMACS_VERSION"
            exit 1
          fi
